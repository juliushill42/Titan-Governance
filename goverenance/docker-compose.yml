services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: titan
      POSTGRES_DB: agent_governance
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d agent_governance"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    environment:
      PG_URL: postgres://titan:titan@postgres:5432/agent_governance?sslmode=disable
      LISTEN_ADDR: ":8090"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
